[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "composio-environment"
version = "0.1.0"
description = "Steers the agent's SaaS-integration requests to your Composio MCP server"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."hermes_agent.plugins"]
composio-environment = "composio_environment"

[tool.setuptools.packages.find]
include = ["composio_environment"]

[tool.setuptools.package-data]
composio_environment = ["plugin.yaml"]
